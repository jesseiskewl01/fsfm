content:
- name: pages
  label: Pages
  type: group
  items:
  - name: homepage
    label: Homepage
    type: file
    path: content/v13/homepage.json
    format: json
    operations:
      delete: false
    fields:
    - name: schemaVersion
      label: false
      type: number
      default: 1
      hidden: true
    - name: template
      label: false
      type: string
      default: homepage
      hidden: true
    - name: identity
      label: Page identity
      component: identity
    - name: templateData
      label: Homepage content
      type: object
      fields:
      - name: hero
        label: Homepage hero window
        type: object
        fields:
        - name: windowTitle
          label: Hero window title
          type: string
        - name: badge
          label: Hero badge
          type: string
        - name: title
          label: Main heading
          type: string
          required: true
        - name: subtitle
          label: Subtitle
          type: string
        - name: handle
          label: Artist handle
          type: string
      - name: desktopLabels
        label: Desktop interface text
        type: object
        fields:
        - name: bootLoading
          label: Loading screen status
          type: string
          default: LOADING YOUR DESKTOP
        - name: bootWelcome
          label: Welcome status
          type: string
          default: WELCOME
        - name: bootReady
          label: Ready status
          type: string
          default: DESKTOP READY
        - name: bootCaption
          label: Loading screen caption
          type: string
          default: SONIC SPACE-AGE AESTHETICS
        - name: shutdownTitle
          label: Shutdown title
          type: string
          default: Goodnight.
        - name: shutdownMessage
          label: Shutdown message
          type: string
          default: Closing the FSFM desktop...
        - name: homeNavigationLabel
          label: Homepage navigation label
          type: string
          default: Home
      - name: gadgets
        label: Homepage desktop gadgets
        type: object
        fields:
        - name: photos
          label: Picture frame photos
          type: image
          list: true
          options:
            media: images
            extensions:
            - jpg
            - jpeg
            - png
            - webp
            - gif
            - svg
            - ico
            rename: false
        - name: dates
          label: Important dates
          type: object
          fields:
          - name: title
            label: Event title
            type: string
          - name: date
            label: Date
            type: date
            default: ''
          - name: description
            label: Description
            type: text
          list:
            collapsible:
              collapsed: true
              summary: '{title}'
        - name: stickyNote
          label: Sticky note
          type: object
          fields:
          - name: text
            label: Note text
            type: text
        - name: labels
          label: Gadget labels and button text
          type: object
          fields:
          - name: clock
            label: Clock gadget title
            type: string
            default: Clock
          - name: calendar
            label: Calendar gadget title
            type: string
            default: Calendar
          - name: pictureFrame
            label: Picture Frame gadget title
            type: string
            default: Picture Frame
          - name: importantDates
            label: Important Dates gadget title
            type: string
            default: Important Dates
          - name: stickyNote
            label: Sticky Note gadget title
            type: string
            default: Sticky Note
          - name: barrelRoll
            label: Barrel Roll gadget title
            type: string
            default: Barrel Roll
          - name: bubbleFrequency
            label: Bubble Frequency gadget title
            type: string
            default: Bubble Frequency
          - name: radio
            label: Radio gadget title
            type: string
            default: FSFM Radio
          - name: purblePlace
            label: Purble Place gadget title
            type: string
            default: Purble Place
          - name: barrelRollButton
            label: Barrel Roll button text
            type: string
            default: DO A BARREL ROLL
          - name: bubbleFrequencyLabel
            label: Bubble slider label
            type: string
            default: AMBIENT BUBBLES
          - name: radioPlay
            label: Radio play button text
            type: string
            default: PLAY MUSIC
          - name: radioPause
            label: Radio pause button text
            type: string
            default: PAUSE MUSIC
          - name: purblePlaceButton
            label: Purble Place button text
            type: string
            default: OPEN PURBLE PLACE
        - name: funWidgets
          label: Desktop gadget visibility
          type: object
          fields:
          - name: showBarrelRoll
            label: Show Barrel Roll button
            type: boolean
            default: true
          - name: showBubbleSlider
            label: Show bubble frequency slider
            type: boolean
            default: true
          - name: showMusicPlayer
            label: Show FSFM Radio gadget
            type: boolean
            default: true
          - name: showPurblePlace
            label: Show Purble Place shortcut
            type: boolean
            default: true
        - name: visibility
          label: Gadget visibility
          type: object
          fields:
          - name: showClock
            label: Show Clock
            type: boolean
            default: true
          - name: showCalendar
            label: Show Calendar
            type: boolean
            default: true
          - name: showFeaturedRelease
            label: Show Featured Release
            type: boolean
            default: true
          - name: showPhotos
            label: Show Picture Frame
            type: boolean
            default: true
          - name: showDates
            label: Show Important Dates
            type: boolean
            default: true
          - name: showStickyNote
            label: Show Sticky Note
            type: boolean
            default: true
        - name: radioAudioUrl
          label: FSFM Radio audio URL
          type: string
          default: https://github.com/jesseiskewl01/fsfm/raw/refs/heads/main/audio/groovy.mp3
        - name: bubbleDefault
          label: Default bubble frequency
          type: number
          default: 50
        - name: purblePlaceUrl
          label: Purble Place embed URL
          type: string
          default: https://www.play-games.com/iframe/37376.html
        - name: featuredRelease
          label: Featured release gadget
          type: object
          fields:
          - name: windowTitle
            label: Window title
            type: string
          - name: title
            label: Release title
            type: string
          - name: description
            label: Release description
            type: string
          - name: artwork
            label: Artwork
            type: image
            options:
              media: images
              extensions:
              - jpg
              - jpeg
              - png
              - webp
              - gif
              - svg
              - ico
              rename: false
          - name: linkText
            label: Link text
            type: string
          - name: url
            label: Destination URL
            type: string
          - name: componentType
            label: Component type
            type: string
            default: featured-release
            readonly: true
        - name: shutdownRedirectUrl
          label: Hero shutdown redirect URL
          type: string
      - name: footerText
        label: Footer text
        type: string
    - name: appearance
      label: Page appearance
      component: appearance
    - name: publishing
      label: Publishing and navigation
      component: publishing
    - name: seo
      label: SEO and sharing
      component: seo
    - name: sections
      label: Homepage content components
      component: homepageSections
  - name: albums
    label: Albums
    type: collection
    path: content/v13/albums
    filename:
      template: '{fields.identity.slug}.json'
      field: false
    format: json
    operations:
      rename: false
      delete: false
    view:
      fields:
    - name: schemaVersion
      label: false
      type: number
      default: 1
      hidden: true
    - name: template
      label: false
      type: string
      default: album
      hidden: true
    - name: identity
      label: Page identity
      component: identity
    - name: templateData
      label: Album content
      type: object
      fields:
      - name: album
        label: Album details
        type: object
        fields:
        - name: windowTitle
          label: Album window title
          type: string
        - name: title
          label: Album title
          type: string
          required: true
        - name: artistLine
          label: Artist line
          type: string
        - name: eyebrow
          label: Eyebrow / release code
          type: string
        - name: artwork
          label: Album artwork
          type: image
          options:
            media: images
            extensions:
            - jpg
            - jpeg
            - png
            - webp
            - gif
            - svg
            - ico
            rename: false
      - name: player
        label: FSFM Media Player
        type: object
        fields:
        - name: windowTitle
          label: Player window title
          type: string
        - name: artistName
          label: Player artist name
          type: string
        - name: tracks
          label: Tracklist
          type: object
          list:
            min: 0
            collapsible:
              collapsed: true
              summary: '{title}'
          fields:
          - name: id
            label: Stable track ID
            type: string
            required: true
          - name: title
            label: Track title
            type: string
            required: true
          - name: audioUrl
            label: External audio URL
            type: string
            default: ''
          - name: audioFile
            label: Uploaded audio file
            type: file
            options:
              media: audio
              path: media/audio
              extensions:
              - ogg
              - mp3
              - wav
              - m4a
              - aac
              - flac
              rename: false
          - name: lyricsFile
            label: Synchronized lyrics (.lrc)
            type: file
            options:
              media: lyrics
              path: lyrics
              extensions:
              - lrc
              rename: false
          - name: instrumental
            label: Instrumental track
            type: boolean
            default: false
        - name: behaviour
          label: Player behaviour
          type: object
          fields:
          - name: autoAdvance
            label: Automatically play next track
            type: boolean
            default: true
          - name: lineWideLyricHighlight
            label: Highlight whole lyric lines
            type: boolean
            default: true
          - name: preload
            label: Audio preload strategy
            type: select
            default: metadata
            options:
              values:
              - none
              - metadata
              - auto
      - name: spotify
        label: Spotify embed
        type: object
        fields:
        - name: label
          label: Spotify section label
          type: string
        - name: embedUrl
          label: Spotify embed URL
          type: string
        - name: height
          label: Embed height (px)
          type: number
          default: 352
      - name: footerText
        label: Footer text
        type: string
    - name: appearance
      label: Page appearance
      component: appearance
    - name: publishing
      label: Publishing and navigation
      component: publishing
    - name: seo
      label: SEO and sharing
      component: seo
    - name: sections
      label: Album page layout
      component: albumSections
      default:
      - type: album-header
        id: album-header
        enabled: true
        presentation:
          variant: amber-editorial
          windowTitle: ''
        content:
          source: templateData.album
      - type: album-player
        id: album-player
        enabled: true
        presentation:
          variant: amber-player
        content:
          source: templateData.player
      - type: spotify-embed
        id: album-spotify
        enabled: true
        presentation:
          variant: amber-editorial
          windowTitle: ''
        content:
          source: templateData.spotify
  - name: vista-pages
    label: Vista Pages
    type: collection
    path: content/v13/vista-pages
    filename:
      template: '{fields.identity.slug}.json'
      field: false
    format: json
    operations:
      rename: false
      delete: false
    view:
      fields:
    - name: schemaVersion
      label: false
      type: number
      default: 1
      hidden: true
    - name: template
      label: false
      type: string
      default: vista-window
      hidden: true
    - name: identity
      label: Page identity
      component: identity
    - name: templateData
      label: Template-specific settings
      type: object
      fields:
      - name: footerText
        label: Footer text
        type: string
    - name: appearance
      label: Page appearance
      component: appearance
    - name: publishing
      label: Publishing and navigation
      component: publishing
    - name: seo
      label: SEO and sharing
      component: seo
    - name: sections
      label: Page building blocks
      component: vistaSections
  - name: editorial-pages
    label: Editorial Pages
    type: collection
    path: content/v13/editorial-pages
    filename:
      template: '{fields.identity.slug}.json'
      field: false
    format: json
    operations:
      rename: false
      delete: false
    view:
      fields:
    - name: schemaVersion
      label: false
      type: number
      default: 1
      hidden: true
    - name: template
      label: false
      type: string
      default: editorial
      hidden: true
    - name: identity
      label: Page identity
      component: identity
    - name: templateData
      label: Template-specific settings
      type: object
      fields:
      - name: footerText
        label: Footer text
        type: string
    - name: appearance
      label: Page appearance
      component: appearance
    - name: publishing
      label: Publishing and navigation
      component: publishing
    - name: seo
      label: SEO and sharing
      component: seo
    - name: sections
      label: Page building blocks
      component: editorialSections
- name: site-settings
  label: Site settings
  type: group
  items:
  - name: site
    label: Global identity and defaults
    type: file
    path: content/v13/site.json
    format: json
    operations:
      delete: false
    fields:
    - name: schemaVersion
      label: false
      type: number
      default: 1
      hidden: true
    - name: siteName
      label: Website name
      type: string
      required: true
    - name: baseUrl
      label: Canonical site URL
      type: string
      required: true
    - name: favicon
      label: Favicon
      type: image
      options:
        media: images
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        - gif
        - svg
        - ico
        rename: false
    - name: description
      label: Default site description
      type: text
    - name: footerText
      label: Default footer text
      type: string
    - name: seoDefaults
      label: Default search and sharing metadata
      type: object
      fields:
      - name: title
        label: Default SEO title
        type: string
      - name: description
        label: Default SEO description
        type: text
      - name: socialImage
        label: Default social image
        type: image
        options:
          media: images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          - svg
          - ico
          rename: false
    - name: socialProfiles
      label: Social profiles
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: label
        label: Platform / network
        type: string
      - name: url
        label: Profile URL
        type: string
  - name: wallpapers
    label: Wallpaper catalogue
    type: file
    path: content/v13/wallpapers.json
    format: json
    operations:
      delete: false
    fields:
    - name: presets
      label: Wallpaper presets
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{name} · {colour}'
      fields:
      - name: id
        label: Preset ID
        type: string
        required: true
      - name: name
        label: Display name
        type: string
        required: true
      - name: family
        label: Wallpaper family
        type: select
        options:
          values:
          - vista
          - atmospheric
          - album
      - name: colour
        label: Colour family
        type: select
        options:
          values:
          - purple
          - teal
          - orange
          - pink
          - multi
          - amber
      - name: kind
        label: Wallpaper type
        type: select
        options:
          values:
          - image
          - css-preset
          - template-preset
      - name: imageUrl
        label: Image URL
        type: string
      - name: status
        label: Status / notes
        type: string
      - name: palette
        label: Theme palette
        type: object
        fields:
        - name: sky
          label: Sky / background
          type: string
        - name: deep
          label: Deep colour
          type: string
        - name: mid
          label: Mid colour
          type: string
        - name: glass
          label: Glass colour
          type: string
        - name: accent
          label: Accent colour
          type: string
        - name: bright
          label: Bright colour
          type: string
        - name: highlight
          label: Highlight colour
          type: string
        - name: ink
          label: Ink colour
          type: string
        - name: dark
          label: Dark colour
          type: string
        - name: earth
          label: Earth colour
          type: string
        - name: caramel
          label: Caramel colour
          type: string
        - name: cream
          label: Cream colour
          type: string
    - name: customImage
      label: Custom image configuration
      type: object
      fields:
      - name: source
        label: Media folder
        type: string
        default: media/images
        readonly: true
      - name: outputPrefix
        label: Public URL prefix
        type: string
        default: /media/images
        readonly: true
      - name: fitOptions
        label: Supported fit modes
        type: string
        list: true
        default:
        - cover
        - contain
settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: 'content: create {path}'
      update: 'content: update {path}'
      delete: 'content: delete {path}'
      rename: 'content: rename {oldPath} -> {newPath}'
