media:
- name: images
  label: Images
  input: media/images
  output: /media/images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
  - ico
  rename: false
  categories:
  - image
- name: audio
  label: Audio
  input: media/audio
  output: /media/audio
  extensions:
  - ogg
  - mp3
  - wav
  - m4a
  - aac
  - flac
  rename: false
  categories:
  - audio
- name: lyrics
  label: Synchronized lyrics
  input: lyrics
  output: lyrics
  extensions:
  - lrc
  rename: false
components:
  blockSiteHeader:
    type: object
    label: Site header
    description: A small shared site identity header for a page.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show block
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: name
        label: Display name
        type: string
        required: true
      - name: handle
        label: Artist handle
        type: string
      - name: logo
        label: Optional logo
        type: image
        options:
          media: images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          - svg
          - ico
          rename: false
  blockHero:
    type: object
    label: Hero
    description: A large page introduction with an optional image and link.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: title
        label: Heading
        type: string
        required: true
      - name: subtitle
        label: Supporting text
        type: text
      - name: image
        label: Hero image
        type: image
        options:
          media: images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          - svg
          - ico
          rename: false
      - name: imageAlt
        label: Image alternative text
        type: string
      - name: linkText
        label: Link text
        type: string
      - name: linkUrl
        label: Link URL
        type: string
  blockMarquee:
    type: object
    label: Marquee
    description: A scrolling strip for short announcements or repeated phrases.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: messages
        label: Scrolling messages
        type: string
        list:
          min: 1
        default: []
  blockArtistStatement:
    type: object
    label: Artist statement
    description: A paragraph or biography block. Use this for a short introduction.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: body
        label: Statement / biography
        type: text
        required: true
  blockEmbedWindow:
    type: object
    label: Embed window
    description: Embed a supported music or video service using its embed URL.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: provider
        label: Embed provider
        type: select
        default: custom
        options:
          values:
          - spotify
          - youtube
          - bandcamp
          - soundcloud
          - custom
      - name: url
        label: Embed URL
        type: string
        required: true
      - name: title
        label: Accessible embed title
        type: string
      - name: height
        label: Embed height (px)
        type: number
        default: 352
  blockBandsintownEvents:
    type: object
    label: Bandsintown events
    description: Show upcoming live dates from the connected Bandsintown artist profile.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: artistName
        label: Bandsintown artist ID
        type: string
        required: true
      - name: appId
        label: Bandsintown app ID
        type: string
        required: true
      - name: displayDetails
        label: Show event details
        type: boolean
        default: true
      - name: displayLineup
        label: Show lineup
        type: boolean
        default: true
      - name: displayStartTime
        label: Show start time
        type: boolean
        default: true
      - name: displayLocalDates
        label: Show local dates
        type: boolean
        default: true
      - name: localDatesPosition
        label: Local dates position
        type: string
      - name: font
        label: Widget font
        type: string
      - name: followSectionPosition
        label: Follow section position
        type: string
      - name: followSectionAlignment
        label: Follow section alignment
        type: string
      - name: followSectionCtaText
        label: Follow button text
        type: string
      - name: eventRsvpPosition
        label: RSVP position
        type: string
      - name: eventRsvpOnlyShowIcon
        label: RSVP icon only
        type: boolean
        default: true
      - name: playMyCityPosition
        label: Play My City position
        type: string
      - name: playMyCityAlignment
        label: Play My City alignment
        type: string
      - name: playMyCityCtaIcon
        label: Play My City icon
        type: boolean
        default: true
  blockSocialLinks:
    type: object
    label: Social links
    description: A tidy list of links to your artist profiles.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: links
        label: Social links
        type: object
        fields:
        - name: label
          label: Network name
          type: string
        - name: url
          label: Profile URL
          type: string
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: '{label}'
  blockFeaturedRelease:
    type: object
    label: Featured release
    description: Highlight one release with artwork, a short description and a destination link.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: title
        label: Release title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: artwork
        label: Artwork
        type: image
        options:
          media: images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          - svg
          - ico
          rename: false
      - name: url
        label: Destination URL
        type: string
        required: true
      - name: linkText
        label: Link text
        type: string
      - name: artworkAlt
        label: Artwork alternative text
        type: string
  blockRichText:
    type: object
    label: Rich text
    description: The flexible text block for headings, paragraphs and formatted content.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: heading
        label: Heading
        type: string
      - name: body
        label: Formatted content
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: images
  blockImage:
    type: object
    label: Image
    description: Add one image with optional alternative text and a caption.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          - svg
          - ico
          rename: false
      - name: alt
        label: Alternative text
        type: string
      - name: caption
        label: Caption
        type: text
  blockGallery:
    type: object
    label: Image gallery
    description: Show a group of images together.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: images
        label: Images
        type: image
        list:
          min: 1
        options:
          media: images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          - svg
          - ico
          rename: false
      - name: altText
        label: Shared alternative text guidance
        type: text
      - name: caption
        label: Gallery caption
        type: text
  blockQuote:
    type: object
    label: Quote
    description: Give a quotation its own visual space, with optional attribution.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: text
        label: Quotation
        type: text
        required: true
      - name: attribution
        label: Attribution
        type: string
  blockLinkButton:
    type: object
    label: Link or button
    description: Add one clear call-to-action link.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: group
      label: Layout group
      component: sectionGroup
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: label
        label: Button text
        type: string
        required: true
      - name: url
        label: Destination URL
        type: string
        required: true
      - name: style
        label: Visual style
        type: select
        default: primary
        options:
          values:
          - primary
          - secondary
          - text
  blockDivider:
    type: object
    label: Divider
    description: Separate nearby blocks with a line, star or space.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: style
        label: Divider style
        type: select
        default: line
        options:
          values:
          - line
          - star
          - space
  blockSpacer:
    type: object
    label: Spacer
    description: Add deliberate empty space between blocks.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: size
        label: Height (px)
        type: number
        default: 32
  blockAlbumHeader:
    type: object
    label: Album header (built-in)
    description: The album artwork and title area. This is included automatically on album pages.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: source
        label: false
        type: string
        default: templateData.album
        hidden: true
  blockAlbumPlayer:
    type: object
    label: FSFM Media Player (required)
    description: The FSFM track player and synchronized lyrics. Required on album pages.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: source
        label: false
        type: string
        default: templateData.player
        hidden: true
  blockSpotifyEmbed:
    type: object
    label: Spotify album embed
    description: An optional Spotify album embed.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
    - name: enabled
      label: Show this section
      type: boolean
      default: true
    - name: presentation
      label: Presentation
      component: sectionPresentation
    - name: content
      label: Content
      type: object
      fields:
      - name: source
        label: false
        type: string
        default: templateData.spotify
        hidden: true
  seo:
    type: object
    label: SEO and sharing
    fields:
    - name: title
      label: Browser and search title
      type: string
      default: ''
    - name: description
      label: Search description
      type: text
      default: ''
    - name: canonical
      label: Canonical URL
      type: string
      default: ''
    - name: socialImage
      label: Social sharing image
      type: image
      options:
        media: images
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        - gif
        - svg
        - ico
        rename: false
    - name: allowIndexing
      label: Allow search engines to index this page
      type: boolean
      default: true
  identity:
    type: object
    label: Page identity
    fields:
    - name: name
      label: Page name
      type: string
      required: true
      description: The name visitors see in the page menu and page headings.
    - name: slug
      label: URL slug
      type: string
      required: true
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      description: Short address used in the URL. Lowercase letters, numbers and hyphens only. Album URLs use /albums/; other pages use /pages/.
    - name: order
      label: Page order
      type: number
      default: 10
  publishing:
    type: object
    label: Publishing and navigation
    description: Drafts stay off the public site. Navigation visibility controls whether a published page appears in the site menu.
    fields:
    - name: published
      label: Published / publicly available
      type: boolean
      default: false
    - name: showInNavigation
      label: Show in site navigation
      type: boolean
      default: true
    - name: navigationLabel
      label: Navigation label
      type: string
      default: ''
  sectionPresentation:
    type: object
    label: Optional block styling
    description: Most blocks can use their template's default style. Change these only when you want a deliberate visual variation.
    fields:
    - name: variant
      label: false
      type: select
      hidden: true
      default: ''
      options:
        values:
        - ''
        - vista-window
        - vista-desktop
        - editorial
        - amber-editorial
        - amber-player
        - plain
    - name: windowTitle
      label: Window / section title
      type: string
      default: ''
  sectionGroup:
    type: object
    label: Arrange with other blocks
    description: Give blocks the same group ID to place them together. Choose grid for side-by-side blocks or stack for a vertical group. Leave blank for normal full-width flow.
    fields:
    - name: id
      label: false
      type: string
      hidden: true
      default: ''
    - name: name
      label: Group name
      type: string
      description: Give blocks the same group name to place them together. Leave blank for a standalone block.
    - name: layout
      label: Layout
      type: select
      default: grid
      options:
        values:
        - grid
        - stack
        - columns
    - name: columns
      label: Columns
      type: number
      default: 2
  appearance:
    type: object
    label: Page appearance
    description: Choose the page wallpaper and visual effects here, before arranging the page layout.
    fields:
    - name: wallpaper
      label: Wallpaper
      type: object
      fields:
      - name: mode
        label: Wallpaper mode
        type: select
        default: template-default
        options:
          values:
          - preset
          - custom
          - cycle
          - template-default
          labels:
          - Preset
          - Custom image
          - Cycle Vista wallpapers
          - Template default
      - name: preset
        label: Static wallpaper preset
        type: select
        default: vista-violet-haze
        options:
          values:
          - vista-violet-haze
          - vista-aqua-glass
          - vista-solar-flare
          - vista-rose-bloom
          - aurora
          - album-amber
          labels:
          - Violet Haze · Purple
          - Aqua Glass · Teal
          - Solar Flare · Orange
          - Rose Bloom · Pink
          - Aurora
          - Album Amber
      - name: presets
        label: false
        type: select
        hidden: true
        list: true
        default:
        - vista-violet-haze
        - vista-aqua-glass
        - vista-solar-flare
        - vista-rose-bloom
        options:
          values:
          - vista-violet-haze
          - vista-aqua-glass
          - vista-solar-flare
          - vista-rose-bloom
          labels:
          - Violet Haze · Purple
          - Aqua Glass · Teal
          - Solar Flare · Orange
          - Rose Bloom · Pink
      - name: customImage
        label: Custom wallpaper image
        type: image
        options:
          media: images
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          - svg
          - ico
          rename: false
      - name: customFit
        label: false
        type: select
        hidden: true
        default: cover
        options:
          values:
          - cover
          - contain
      - name: customPosition
        label: false
        type: select
        hidden: true
        default: center
        options:
          values:
          - center
          - top
          - bottom
          - left
          - right
          - top-left
          - top-right
          - bottom-left
          - bottom-right
      - name: initialSelection
        label: false
        type: select
        hidden: true
        default: random
        options:
          values:
          - random
          - vista-violet-haze
          - vista-aqua-glass
          - vista-solar-flare
          - vista-rose-bloom
      - name: cycle
        label: Wallpaper cycling
        type: object
        fields:
        - name: enabled
          label: Automatically rotate wallpapers
          type: boolean
          default: false
        - name: mode
          label: false
          type: select
          hidden: true
          default: sequential
          options:
            values:
            - sequential
            - random
        - name: intervalSeconds
          label: false
          type: number
          hidden: true
          default: 30
        - name: manualControl
          label: false
          type: boolean
          hidden: true
          default: true
    - name: effects
      label: Background and motion effects
      type: object
      fields:
      - name: backgroundEffects
        label: false
        type: boolean
        hidden: true
        default: true
      - name: pageTransition
        label: false
        type: boolean
        hidden: true
        default: true
      - name: respectReducedMotion
        label: false
        type: boolean
        hidden: true
        default: true
  homepageSections:
    type: block
    label: PAGE LAYOUT · HOMEPAGE BUILDING BLOCKS
    description: This is the main page builder. Add blocks, edit their content, and arrange them in the order visitors should see.
    list:
      collapsible:
        collapsed: true
        summary: '{type} · {id}'
    blockKey: type
    blocks:
    - name: site-header
      label: Site header
      component: blockSiteHeader
    - name: hero
      label: Hero
      component: blockHero
    - name: marquee
      label: Marquee
      component: blockMarquee
    - name: artist-statement
      label: Artist statement
      component: blockArtistStatement
    - name: embed-window
      label: Embed window
      component: blockEmbedWindow
    - name: bandsintown-events
      label: Bandsintown events
      component: blockBandsintownEvents
    - name: social-links
      label: Social links
      component: blockSocialLinks
    - name: featured-release
      label: Featured release
      component: blockFeaturedRelease
    - name: rich-text
      label: Rich text
      component: blockRichText
    - name: image
      label: Image
      component: blockImage
    - name: gallery
      label: Image gallery
      component: blockGallery
    - name: quote
      label: Quote
      component: blockQuote
    - name: link-button
      label: Link or button
      component: blockLinkButton
    - name: divider
      label: Divider
      component: blockDivider
    - name: spacer
      label: Spacer
      component: blockSpacer
  albumSections:
    type: block
    label: PAGE LAYOUT · ALBUM BUILDING BLOCKS
    description: This is the main page builder. The album header and player are required; add optional blocks around them.
    list:
      collapsible:
        collapsed: true
        summary: '{type} · {id}'
    blockKey: type
    blocks:
    - name: site-header
      label: Site header
      component: blockSiteHeader
    - name: marquee
      label: Marquee
      component: blockMarquee
    - name: artist-statement
      label: Artist statement
      component: blockArtistStatement
    - name: embed-window
      label: Embed window
      component: blockEmbedWindow
    - name: social-links
      label: Social links
      component: blockSocialLinks
    - name: featured-release
      label: Featured release
      component: blockFeaturedRelease
    - name: rich-text
      label: Rich text
      component: blockRichText
    - name: image
      label: Image
      component: blockImage
    - name: gallery
      label: Image gallery
      component: blockGallery
    - name: quote
      label: Quote
      component: blockQuote
    - name: link-button
      label: Link or button
      component: blockLinkButton
    - name: divider
      label: Divider
      component: blockDivider
    - name: spacer
      label: Spacer
      component: blockSpacer
    - name: album-header
      label: Album header (built-in)
      component: blockAlbumHeader
    - name: album-player
      label: FSFM Media Player (required)
      component: blockAlbumPlayer
    - name: spotify-embed
      label: Spotify album embed
      component: blockSpotifyEmbed
  vistaSections:
    type: block
    label: PAGE LAYOUT · BUILDING BLOCKS
    description: Add, edit and reorder the content blocks that make up this page.
    list:
      collapsible:
        collapsed: true
        summary: '{type} · {id}'
    blockKey: type
    blocks:
    - name: site-header
      label: Site header
      component: blockSiteHeader
    - name: hero
      label: Hero
      component: blockHero
    - name: marquee
      label: Marquee
      component: blockMarquee
    - name: artist-statement
      label: Artist statement
      component: blockArtistStatement
    - name: embed-window
      label: Embed window
      component: blockEmbedWindow
    - name: bandsintown-events
      label: Bandsintown events
      component: blockBandsintownEvents
    - name: social-links
      label: Social links
      component: blockSocialLinks
