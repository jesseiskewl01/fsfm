name: V14 validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - v14-rebuild

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and static checks
        run: npm run check:all
      - name: Build production site
        run: npm run build
      - name: Audit production output
        run: npm run audit:v14
